<!--Screen- object representing actual physical screen of device. screen.width is a property that returns width in pixels. screen.height does the same for height-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Window Object Demo</title>
    </head>
    <body>
        <h2>Screen Object Demo</h2>
        <button onclick="showScreenInfo()">Show Screen Details</button>
        <script>
            function showScreenInfo(){
                alert("Width: "+screen.width+"\nHeight: "+screen.height);
            };
        </script>
    </body>
</html>
