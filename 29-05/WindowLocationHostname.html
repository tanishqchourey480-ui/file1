<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hostname Property Demo</title>
    </head>
    <body>
        <h2>Hostname Property Demo</h2>
        <button onclick="showURL()">Show URL</button>
        <script>
            function showURL(){
                alert("Full URL: "+location.href+"/nHostname: "+location.hostname);//location.hostname is a property of location Object that returns domainname of webpage
            }
        </script>
    </body>
</html>
