<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Window Object Demo</title>
    </head>
    <body>
        <h2>Window Location Demo</h2>
        <button onclick="goToGoogle()">GOOG</button>
        <script>
            function goToGoogle(){
                window.location.href="https://www.google.com";//window.location is a property of current window that allows getting or setting current URL. Can be used to go to new page, reload current page, or access URL components like hostname, pathname etc.
            }
        </script>
    </body>
</html>
