<!--History- object that allows going to previously visited pages. history.forward() or history.back()-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>History Object Demo Page 2</title>
    </head>
    <body>
        <h2>This is Page 2</h2>
        <button onclick="goBack()">Go Back</button>
        <script>
            function goBack(){
                window.history.back();//goes to the previous page in history list if there is one
            };
        </script>
    </body>
</html>
