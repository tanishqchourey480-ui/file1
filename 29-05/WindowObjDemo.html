<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Window Object Demo</title>
    </head>
    <body>
        <h2>Window Object Demo</h2>
        <button onclick="showAlert()">Show Alert</button>
        <button onclick="showWinSize()">Show Window Size</button>
        <script>
            function showAlert(){
                window.alert("Hello! This is the Window Object, and a call of the Alert Method.");
            }
            function showWinSize(){
                alert("Width: "+window.innerWidth+"\nHeight: "+window.innerHeight);
            };
        </script>
    </body>
</html>
