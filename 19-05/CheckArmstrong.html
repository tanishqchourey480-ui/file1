<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script>
            function armstrongCheckFun(){
                var a,b,c,d;
                a=parseInt(document.getElementById("tb1").value);
                b=((a%10)*(a%10)*(a%10))+((((a%100)-(a%10))/10)*(((a%100)-(a%10))/10)*(((a%100)-(a%10))/10))+((((a%1000)-(a%100))/100)*(((a%1000)-(a%100))/100)*(((a%1000)-(a%100))/100));
                if(a==b){
                    document.getElementById("tb2").value="Number is Armstrong.";
                }
                else{
                    document.getElementById("tb2").value="Number is not Armstrong.";
                }
            }
        </script>
    </head>
    <body>
        <h1>Check Armstrong Number</h1>
        <p>Enter 3-digit number <input type="text", id="tb1"></p>
        <p>Result <input type="text", id="tb2"></p>
        <p><button type="submit" onclick="armstrongCheckFun()">Check Armstrong</button></p>
    </body>
</html>
