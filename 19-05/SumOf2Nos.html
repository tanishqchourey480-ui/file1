<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script>
            function sumFun(){
                var a,b,c;
                a=parseInt(document.getElementById("tb1").value);
                b=parseInt(document.getElementById("tb2").value);
                a=a+b;
                document.getElementById("tb3").value=a;
            }
        </script>
    </head>
    <body>
        <h1>Addition of two numbers</h1>
        <p>Enter first number <input type="text", id="tb1"></p>
        <p>Enter second number <input type="text", id="tb2"></p>
        <p>Result <input type="text", id="tb3"></p>
        <p><button type="submit" onclick="sumFun()">Sum</button></p>
    </body>
</html>
