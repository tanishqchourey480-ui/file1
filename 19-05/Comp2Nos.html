<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script>
            function compFun(){
                var a,b,c;
                a=parseInt(document.getElementById("tb1").value);
                b=parseInt(document.getElementById("tb2").value);
                if(a>b){
                    document.getElementById("tb3").value="First number is greater.";
                }
                if(a<b){
                    document.getElementById("tb3").value="Second number is greater.";
                }
                if(a==b){
                    document.getElementById("tb3").value="Both numbers are equal.";
                }
            }
        </script>
    </head>
    <body>
        <h1>Comparison of two numbers</h1>
        <p>Enter first number <input type="text", id="tb1"></p>
        <p>Enter second number <input type="text", id="tb2"></p>
        <p>Result <input type="text", id="tb3"></p>
        <p><button type="submit" onclick="compFun()">COMPARE</button></p>
    </body>
</html>
