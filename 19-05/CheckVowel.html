<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script>
            function checkVowelFun(){
                var a;
                a=document.getElementById("tb1").value;
                if(a=="a"||a=="e"||a=="i"||a=="o"||a=="u"||a=="A"||a=="E"||a=="I"||a=="O"||a=="U"){
                    document.getElementById("tb2").value="Alphabet is a vowel.";
                }
                else{
                    document.getElementById("tb2").value="Alphabet is a consonant.";
                }
            }
        </script>
    </head>
    <body>
        <h1>Check Armstrong Number</h1>
        <p>Enter an Alphabet <input type="text", id="tb1"></p>
        <p>Result <input type="text", id="tb2"></p>
        <p><button type="submit" onclick="checkVowelFun()">Check</button></p>
    </body>
</html>
