<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script>
            function circAreaFun(){
                var a,b;
                a=parseInt(document.getElementById("tb1").value);
                b=3.14*a*a;
                document.getElementById("tb2").value=b;
            }
        </script>
    </head>
    <body>
        <h1>Area of a Circle</h1>
        <p>Enter radius <input type="text", id="tb1"></p>
        <p>Area <input type="text", id="tb2"></p>
        <p><button type="submit" onclick="circAreaFun()">Calculate</button></p>
    </body>
</html>
