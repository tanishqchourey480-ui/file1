<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script>
            function comp5Fun(){
                var a,b,c,d,e,A,B,C,D,E;
                a=parseInt(document.getElementById("tb1").value);
                b=parseInt(document.getElementById("tb2").value);
                c=parseInt(document.getElementById("tb3").value);
                d=parseInt(document.getElementById("tb4").value);
                e=parseInt(document.getElementById("tb5").value);
                if(a>b){
                    A++;
                }
                if(a>c){
                    A++;
                }
                if(a>d){
                    A++;
                }
                if(a>e){
                    A++;
                }
                if(b>a){
                    B++;
                }
                if(b>c){
                    B++;
                }
                if(b>d){
                    B++;
                }
                if(b>e){
                    B++;
                }
                if(c>a){
                    C++;
                }
                if(c>b){
                    C++;
                }
                if(c>d){
                    C++;
                }
                if(c>e){
                    C++;
                }
                if(d>a){
                    D++;
                }
                if(d>b){
                    D++;
                }
                if(d>c){
                    D++;
                }
                if(d>e){
                    D++;
                }
                if(e>a){
                    E++;
                }
                if(e>b){
                    E++;
                }
                if(e>c){
                    E++;
                }
                if(e>d){
                    E++;
                }
                if(A==4){
                    document.getElementById("tb6").value="First number is greatest.";
                }
                if(B==4){
                    document.getElementById("tb6").value="Second number is greatest.";
                }
                if(C==4){
                    document.getElementById("tb6").value="Third number is greatest.";
                }
                if(D==4){
                    document.getElementById("tb6").value="Fourth number is greatest.";
                }
                if(E==4){
                    document.getElementById("tb6").value="Fifth number is greatest.";
                }
            }
        </script>
    </head>
    <body>
        <h1>Greatest of five numbers</h1>
        <p>Enter first number <input type="text", id="tb1"></p>
        <p>Enter second number <input type="text", id="tb2"></p>
        <p>Enter third number <input type="text", id="tb3"></p>
        <p>Enter fourth number <input type="text", id="tb4"></p>
        <p>Enter fifth number <input type="text", id="tb5"></p>
        <p>Result <input type="text", id="tb6"></p>
        <p><button type="submit" onclick="comp5Fun()">COMPARE</button></p>
    </body>
</html>
