<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script>//Type 3 function
            function digitsFun(num){
                var a=0;
                for(num;num>0;num=parseInt(num/10)){
                    a++;
                }
                return(a);
            }
            function mainFun(){
                var num,res;
                num=parseInt(document.getElementById("tb1").value);
                res=digitsFun(num);
                document.getElementById("tb2").value=res;
            }
        </script>
    </head>
    <body>
        <h1>Digits of Given Number</h1>
        <p>Enter number <input type="text", id="tb1"></p>
        <p>Result <input type="text", id="tb2"></p>
        <p><button type="submit" onclick="mainFun()">Count Digits</button></p>
    </body>
</html>
