<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script>//Type 1 Function: No argument, no return
            function evenOddFun(){
                var a;
                a=parseInt(prompt("Enter number"));
                a%2==0?alert("Number is Even"):alert("Number is Odd");
            }
            function mainFun(){
                evenOddFun();
            }
        </script>
    </head>
    <body>
        <h1>Check if number is Odd or Even</h1>
        <p><button type="submit" onclick="mainFun()">Check</button></p>
    </body>
</html>
