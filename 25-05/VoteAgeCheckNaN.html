<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script>//Type 1 function
            function checkVoteAgeFun(){
                let age=document.getElementById("tb1").value;
                isNaN(age)?alert("Please enter age in digits."):((age>=18)?alert("You can vote."):alert("No vote for you."));
            }
        </script>
    </head>
    <body>
        <h1>Check Age for Voting</h1>
        <p>Enter age <input type="text", id="tb1"></p>
        <p><button type="submit" onclick="checkVoteAgeFun()">check</button></p>
    </body>
</html>
