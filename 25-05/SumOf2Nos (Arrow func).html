<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script>//Arrow function
            var sum=()=>{
                var a,b,c;
                a=10;
                b=20;
                c=a+b;
                alert("Sum= "+c);
            }
            function mainFun(){
                sum();
            }
        </script>
    </head>
    <body>
        <h1>Sum of 10 & 20 via Arrow Function</h1>
        <p><button type="submit" onclick="mainFun()">Sum</button></p>
    </body>
</html>
