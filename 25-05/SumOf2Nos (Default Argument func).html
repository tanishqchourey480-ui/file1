<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script>//Default Argument function
            function sumFun(a=10,b=20){
                var c;
                c=a+b;
                document.write("<br>Value of a= "+a+"<br>Value of b= "+b+"<br>Sum= "+c);
            }
            function mainFun(){
                document.write("Function Call with zero arguments:");
                sumFun();
                document.write("<br><br>Function Call with one argument:");
                sumFun(5);
                document.write("<br><br>Function Call with two arguments:");
                sumFun(5,3);
            }
        </script>
    </head>
    <body>
        <p><button type="submit" onclick="mainFun()">Sum</button></p>
    </body>
</html>
