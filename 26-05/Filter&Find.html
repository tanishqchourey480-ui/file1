<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script>
            var a=[50,8,6,10,3,11]
            function checkPrimeFun(n){
                var c=0,i;
                for(i=1;i<=n;i++){
                    if(n%i==0){
                        c+=1;
                    }
                }
                if(c==2){
                    return true;
                }
            }
            function mainFun(){
                var res1=a.filter(checkPrimeFun);
                document.write("Filter Result: "+res1+"<br>");
                var res2=a.find(checkPrimeFun);
                document.write("Find Result: "+res2);
            }
        </script>
    </head>
    <body>
        <h1>Filter() & Find() Function Demo</h1>
        <p><button type="submit" onclick="mainFun()">show</button></p>
    </body>
</html>
