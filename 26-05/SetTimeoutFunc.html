<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <h1>setTimeout() Function Demo</h1>
        <p><button type="submit" onclick="showMessageFun()">Click to see message in 2 seconds</button></p>
        <script>
            function showMessageFun(){
                setTimeout(alert("Hello! This message was displayed after 2 seconds"),2000);
            }
        </script>
    </body>
</html>
