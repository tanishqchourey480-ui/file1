<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script>
            function matrixFun(){
                var a,b,c;
                for(a=5;a>=1;a--){
                    for(c=5-a;c>0;c--){
                        document.write("_ ");
                    }
                    for(b=1;b<=a;b++){
                        document.write(b+" ");
                    }
                    document.write("<br>");
                }
                }
        </script>
    </head>
    <body>
        <p><button type="submit" onclick="matrixFun()">Show</button></p>
    </body>
</html>
