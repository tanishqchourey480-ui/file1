<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script>
            function calcFun(){
                var num1,num2,result,choice;
                do{
                    choice=prompt("Enter Operation: + - * / or q to Quit");
                    num1=parseInt(prompt("Enter First Number"));
                    num2=parseInt(prompt("Enter Second Number"));
                switch(choice){
                    case "+":
                        result=num1+num2;
                        alert("Sum is "+result);
                        break;
                    case "-":
                        result=num1-num2;
                        alert("Difference is "+result);
                        break;
                    case "*":
                        result=num1*num2;
                        alert("Product is "+result);
                        break;
                    case "/":
                        result=num1/num2;
                        alert("Quotient is "+result);
                        break;
                    case "q":
                        break;
                    default:
                        alert("Invalid Operation Input");
                        break;
                }
            }while(choice!="q")
        }
        </script>
    </head>
    <body>
        <button type="submit" onclick="calcFun()">Calculate</button></p>
    </body>
</html>
