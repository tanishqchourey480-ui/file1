<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script>
            function matrixFun(){
                var a,b=1;
                for(a=1;a<=5;a++){
                    for(b=a;b<=5;b++){
                        document.write(b+" ");
                    }
                    document.write("<br>");
                }
                }
        </script>
    </head>
    <body>
        <p><button type="submit" onclick="matrixFun()">Show</button></p>
    </body>
</html>
