<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script>
            function digitSumFun(){
                var n,r,sum=0;
                n=parseInt(document.getElementById("tb1").value);
                while(n>0){
                    r=n%10;
                    sum=sum+r;
                    n=parseInt(n/10);
                }
                document.getElementById("tb2").value=sum;
            }
        </script>
    </head>
    <body>
        <h1>Sum of Digits of Given Number</h1>
        <p>Enter number <input type="text", id="tb1"></p>
        <p>Result <input type="text", id="tb2"></p>
        <p><button type="submit" onclick="digitSumFun()">Sum</button></p>
    </body>
</html>
