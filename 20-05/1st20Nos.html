<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script>
            function showNumFun(){
                var a,b,c;
                for(a=1;a<=20;a++){
                    document.write(a+"<br>");
                }
            }
        </script>
    </head>
    <body>
        <h1>First twenty numbers</h1>
        <p><button type="submit" onclick="showNumFun()">Show</button></p>
    </body>
</html>
