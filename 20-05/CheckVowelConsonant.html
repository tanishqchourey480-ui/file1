<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script>
            function checkVowConsFun(){
                var a;
                a=prompt("Enter Lowecase Letter");
                let b= a.toLowerCase()
                switch(b){
                    case "a":
                        alert("Vowel");
                        break;
                    case "e":
                        alert("Vowel");
                        break;
                    case "i":
                        alert("Vowel");
                        break;
                    case "o":
                        alert("Vowel");
                        break;
                    case "u":
                        alert("Vowel");
                        break;
                    default:
                        alert("Consonant");
                        break;
                }
            }
        </script>
    </head>
    <body>
        <button type="submit" onclick="checkVowConsFun()">Click</button></p>
    </body>
</html>
