<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script>
            function showEvenFun(){
                var a=1;
                while(a<=20){
                    if(a%2==0){
                        document.write(a+"<br>");
                    }
                    a++
                }
                document.getElementById("tb2").value=a;
            }
        </script>
    </head>
    <body>
        <h1>Even Numbers from 1 to 20</h1>
        <p><button type="submit" onclick="showEvenFun()">Show Numbers</button></p>
    </body>
</html>
