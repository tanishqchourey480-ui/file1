<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script>
            function numOddEvenFun(){
                var num;
                num=parseInt(document.getElementById("tb1").value);
                num%2==0?document.getElementById("tb2").value="Even":document.getElementById("tb2").value="Odd";
            }
        </script>
    </head>
    <body>
        <h1>Odd or Even number</h1>
        <p>Enter number <input type="text", id="tb1"></p>
        <p>Result <input type="text", id="tb2"></p>
        <p><button type="submit" onclick="numOddEvenFun()">Check</button></p>
    </body>
</html>
